services:
  jss-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jss-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET}"
    volumes:
      - jss-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  jss-data:
