<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Automation flow illustration">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- aurora glows -->
  <ellipse cx="120" cy="120" rx="180" ry="180" fill="url(#g3)"/>
  <ellipse cx="680" cy="380" rx="180" ry="180" fill="url(#g4)"/>

  <!-- subtle grid -->
  <g stroke="rgba(148,163,184,0.07)" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800"/>
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500"/>
  </g>

  <!-- connecting flow lines -->
  <g fill="none" stroke="url(#g2)" stroke-width="2" stroke-linecap="round">
    <path d="M180 250 Q 280 180 400 250"/>
    <path d="M400 250 Q 520 320 620 250"/>
    <path d="M180 250 Q 280 320 400 250"/>
  </g>

  <!-- left node: input source -->
  <g transform="translate(140 210)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="rgba(15,23,42,0.85)" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>
    <rect x="14" y="20" width="52" height="6" rx="3" fill="#06b6d4"/>
    <rect x="14" y="32" width="36" height="6" rx="3" fill="#3b82f6" opacity="0.7"/>
    <rect x="14" y="44" width="44" height="6" rx="3" fill="#3b82f6" opacity="0.4"/>
    <rect x="14" y="56" width="28" height="6" rx="3" fill="#3b82f6" opacity="0.25"/>
    <text x="40" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="0.1em">DATA</text>
  </g>

  <!-- center node: automation engine (the J badge) -->
  <g transform="translate(360 210)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#g1)"/>
    <text x="40" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-weight="800" font-size="48" fill="#ffffff" letter-spacing="-0.04em">J</text>
  </g>
  <text x="400" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="0.1em">AUTOMATE</text>

  <!-- right node: output / dashboard -->
  <g transform="translate(580 210)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="rgba(15,23,42,0.85)" stroke="rgba(139,92,246,0.5)" stroke-width="1.5"/>
    <!-- bar chart -->
    <rect x="14" y="50" width="9" height="14" rx="2" fill="#8b5cf6" opacity="0.9"/>
    <rect x="27" y="40" width="9" height="24" rx="2" fill="#8b5cf6" opacity="0.7"/>
    <rect x="40" y="28" width="9" height="36" rx="2" fill="#06b6d4" opacity="0.9"/>
    <rect x="53" y="20" width="9" height="44" rx="2" fill="#06b6d4"/>
    <path d="M14 18 L40 18" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <text x="40" y="100" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="0.1em">INSIGHTS</text>
  </g>

  <!-- floating badges around -->
  <g transform="translate(70 60)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="rgba(15,23,42,0.7)" stroke="rgba(6,182,212,0.3)"/>
    <circle cx="18" cy="17" r="5" fill="#10b981"/>
    <text x="32" y="22" font-family="ui-sans-serif, system-ui" font-size="13" fill="#cbd5e1" font-weight="500">API · 200 OK</text>
  </g>
  <g transform="translate(620 70)">
    <rect x="0" y="0" width="100" height="34" rx="17" fill="rgba(15,23,42,0.7)" stroke="rgba(139,92,246,0.3)"/>
    <text x="14" y="22" font-family="ui-sans-serif, system-ui" font-size="13" fill="#cbd5e1" font-weight="500">QA · 100%</text>
    <circle cx="86" cy="17" r="5" fill="#06b6d4"/>
  </g>
  <g transform="translate(80 410)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="rgba(15,23,42,0.7)" stroke="rgba(59,130,246,0.3)"/>
    <text x="14" y="22" font-family="ui-sans-serif, system-ui" font-size="13" fill="#cbd5e1" font-weight="500">⚡ 0.4s response</text>
  </g>
  <g transform="translate(580 415)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="rgba(15,23,42,0.7)" stroke="rgba(16,185,129,0.3)"/>
    <circle cx="18" cy="17" r="5" fill="#10b981"/>
    <text x="32" y="22" font-family="ui-sans-serif, system-ui" font-size="13" fill="#cbd5e1" font-weight="500">Tests · passing</text>
  </g>

  <!-- moving dots on the lines (visual energy) -->
  <circle cx="280" cy="218" r="3.5" fill="#06b6d4"/>
  <circle cx="510" cy="282" r="3.5" fill="#8b5cf6"/>
</svg>
